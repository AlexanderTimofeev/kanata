name: experimental-kmdf-input-diagnostics

on:
  push:
    branches:
      - experiment/kmdf-input-diagnostics-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-kmdf-diagnostic-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: experimental-kmdf-diagnostics-x64
      - name: Check KMDF command-line build
        run: cargo check --locked --features kmdf_driver --target x86_64-pc-windows-msvc
      - name: Build experimental tray executable
        run: cargo build --release --locked --features gui_kmdf_cmd --target x86_64-pc-windows-msvc
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/kanata.exe artifacts/kanata-kmdf-diag-experimental.exe
      - uses: actions/upload-artifact@v7
        with:
          name: kanata-kmdf-input-diagnostics-windows-x64
          path: artifacts/kanata-kmdf-diag-experimental.exe
          if-no-files-found: error
